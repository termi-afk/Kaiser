name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ hashFiles('build.ps1') }}

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build MSI
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '1.23.1' }
          ./build.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: Kaiser-Setup
          path: out/*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem out/*).FullName `
            --title "Kaiser-Installer ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: web-sources-${{ hashFiles('tools/build_web.py', 'tools/build_winhlp32.sh', 'data/wine-6.0-winhlp32-popup.patch') }}
          restore-keys: web-sources-

      - name: Build web version
        run: |
          # 32-bit compiler etc. for WinHelp from the Wine source (tools/build_winhlp32.sh)
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib flex bison > /dev/null
          python -m pip install --quiet pillow
          python tools/build_web.py build/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
