name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ hashFiles('build.ps1') }}

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build MSI
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '1.23.1' }
          ./build.ps1 -Version $v

      - uses: actions/upload-artifact@v4
        with:
          name: Kaiser-Setup
          path: out/*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem out/*).FullName `
            --title "Kaiser-Installer ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
